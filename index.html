<script>
(function(){
 var app=document.getElementById('app');
 var reported=false;
 function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]});}
 window.__hmkBootFailure=function(detail){
  if(reported||document.querySelector('#app .shell'))return;
  reported=true;
  var msg=String(detail||'Neznámá chyba načítání.');
  app.innerHTML='<main class="hmk-boot-note" role="alert"><h1>HMK Keeper’s Ledger se nenačetl</h1><p>Verze 93.632 nemohla spustit aplikaci. <strong>Vaše uložené postavy tím nebyly smazány.</strong></p><p><strong>Diagnostika:</strong> <code>'+esc(msg)+'</code></p><p>Zkontrolujte, že je v kořenové složce publikovaného GitHub Pages webu soubor <code>app.js</code> a podsložku <code>src/</code> společně s <code>index.html</code>. Poté obnovte stránku pomocí Ctrl+F5. V případě trvající chyby pošlete URL webu a obsah konzole prohlížeče (F12).</p></main>';
 };
 window.addEventListener('error',function(event){if(!document.querySelector('#app .shell'))window.__hmkBootFailure(event.message||('Nelze načíst '+(event.filename||'skript')));});
 window.addEventListener('unhandledrejection',function(event){if(!document.querySelector('#app .shell'))window.__hmkBootFailure(event.reason?.message||String(event.reason));});
 window.addEventListener('load',function(){setTimeout(function(){if(!document.querySelector('#app .shell'))window.__hmkBootFailure('Produkční aplikace se nespustila nebo nebyl načten její JavaScript.');},4000);});
})();
</script>
<script type="module" src="./app.js?v=93.632-minutes" onerror="window.__hmkBootFailure('HTTP chyba: chybí app.js nebo některý z importovaných modulů není dostupný na GitHub Pages.')"></script>

<script>
(function(){
  // v2 starts clean: older drafts could still contain checked traits from completed generations.
  const GENERATOR_KEY='hmk-ledger-generator-config-v2';
  const CREATION_KEY='hmk-ledger-creation-draft-v1';
  const LAST_CREATION_ID='hmk-ledger-last-creation-character-v1';
  // One-time migration: older releases saved unconfirmed input/change events
  // into sessionStorage. Never restore those abandoned pre-598 drafts.
  try{
    for(let i=sessionStorage.length-1;i>=0;i--){
      const key=sessionStorage.key(i);
      if(key===GENERATOR_KEY||key?.startsWith(CREATION_KEY+'::'))sessionStorage.removeItem(key);
    }
  }catch{}


  function safeGet(key){
    try{return sessionStorage.getItem(key)}catch{return null}
  }
  function safeSet(key,value){
    try{sessionStorage.setItem(key,value)}catch{}
  }
  function parseJSON(value,fallback){
    if(!value)return fallback;
    try{return JSON.parse(value)}catch{return fallback}
  }
  function serializeForm(form){
    const out={};
    const boxes={};
    [...form.elements].forEach(el=>{
      if(!el.name||el.disabled) return;
      const type=(el.type||'').toLowerCase();
      if(type==='button'||type==='submit'||type==='reset'||type==='file') return;
      if(type==='checkbox'){
        (boxes[el.name] ||= []).push({value:el.value,checked:!!el.checked});
        return;
      }
      if(type==='radio'){
        if(el.checked) out[el.name]={type:'radio',value:el.value};
        return;
      }
      if(el instanceof HTMLSelectElement && el.multiple){
        out[el.name]={type:'multi',value:[...el.selectedOptions].map(o=>o.value)};
        return;
      }
      out[el.name]={type:'value',value:el.value};
    });
    Object.keys(boxes).forEach(name=>{out[name]={type:'checkboxes',value:boxes[name]}});
    return out;
  }
  function restoreForm(form,snapshot,{preferExisting=true}={}){
    if(!snapshot) return;
    [...form.elements].forEach(el=>{
      if(!el.name||el.disabled) return;
      const spec=snapshot[el.name];
      if(!spec) return;
      const type=(el.type||'').toLowerCase();
      if(spec.type==='checkboxes' && type==='checkbox'){
        if(preferExisting){
          const anyChecked=[...form.querySelectorAll('input[type="checkbox"][name="'+CSS.escape(el.name)+'"]')].some(x=>x.checked);
          if(anyChecked) return;
        }
        const hit=spec.value.find(x=>String(x.value)===String(el.value));
        if(hit) el.checked=!!hit.checked;
        return;
      }
      if(spec.type==='radio' && type==='radio'){
        if(preferExisting){
          const anyChecked=[...form.querySelectorAll('input[type="radio"][name="'+CSS.escape(el.name)+'"]')].some(x=>x.checked);
          if(anyChecked) return;
        }
        el.checked=String(spec.value)===String(el.value);
        return;
      }
      if(spec.type==='multi' && el instanceof HTMLSelectElement && el.multiple){
        if(preferExisting && [...el.selectedOptions].length) return;
        [...el.options].forEach(o=>o.selected=spec.value.includes(o.value));
        return;
      }
      if(spec.type==='value'){
        if(preferExisting){
          if(el instanceof HTMLSelectElement){ if(el.value) return; }
          else if(type!=='hidden' && String(el.value||'').trim()!=='') return;
        }
        el.value=spec.value ?? '';
      }
    });
  }
  function creationDraftKey(form){
    const charId=safeGet(LAST_CREATION_ID)||'unknown';
    const eyebrow=document.querySelector('.folio-creation-active__eyebrow')?.textContent||'';
    const step=(eyebrow.match(/Krok\s+(\d+)/)||[])[1]||'0';
    const stage=(document.querySelector('.folio-creation-active__stage')?.textContent||'').replace(/\s+/g,' ').trim()||'-';
    return [CREATION_KEY,charId,step,stage].join('::');
  }
  // Only the human-controlled wizard may persist/restore its form draft.
  // Automatic generation drives the authoritative CAS wizard and never owns
  // the cached form associated with LAST_CREATION_ID.
  function automaticCreationActive(){return document.documentElement.hasAttribute('data-hmk-automatic-creation');}
  function persistCreationDraft(form){
    if(automaticCreationActive())return;
    safeSet(creationDraftKey(form),JSON.stringify(serializeForm(form)));
  }
  function restoreCreationDraft(form){
    if(automaticCreationActive())return;
    if(form.dataset.hmkDraftReady==='1') return;
    // The authoritative CAS creation engine may have cleared values after a
    // changed prerequisite. Never reinsert stale session-only form fields in
    // a revision step: that would silently undo the user's invalidation.
    const revision=document.querySelector('.folio-creation-revision-current, .folio-creation-revision-target');
    if(revision){
      try{sessionStorage.removeItem(creationDraftKey(form))}catch{}
      form.dataset.hmkDraftReady='1';
      return;
    }
    const snapshot=parseJSON(safeGet(creationDraftKey(form)),null);
    if(snapshot) restoreForm(form,snapshot,{preferExisting:true});
    form.dataset.hmkDraftReady='1';
  }
  function persistGeneratorDraft(form){safeSet(GENERATOR_KEY,JSON.stringify(serializeForm(form)));}
  function restoreGeneratorDraft(form){
    if(form.dataset.hmkDraftReady==='1') return;
    const snapshot=parseJSON(safeGet(GENERATOR_KEY),null);
    if(snapshot)restoreForm(form,snapshot,{preferExisting:false});
    form.dataset.hmkDraftReady='1';
    if(snapshot)form.dispatchEvent(new Event('change',{bubbles:true}));
  }
  function enhance(){
    const creationForm=document.getElementById('creation-step-form');
    if(creationForm) restoreCreationDraft(creationForm);
    const generatorForm=document.getElementById('hmk-generator-config');
    if(generatorForm) restoreGeneratorDraft(generatorForm);
  }
  // Only an explicit reset may clear an unfinished trait selection. Save the
  // cleared snapshot immediately so rerender/browser form restoration cannot
  // re-check the boxes after the user leaves and reopens the dialog.
  document.addEventListener('click',event=>{
    const button=event.target?.closest?.('[data-generator-reset-traits]');
    const form=button?.closest?.('#hmk-generator-config');
    if(!form)return;
    event.preventDefault();
    form.querySelectorAll('input[type="checkbox"][name="trait"]').forEach(input=>{
      input.checked=false;
      input.defaultChecked=false;
    });
    persistGeneratorDraft(form);
    form.dispatchEvent(new Event('change',{bubbles:true}));
  },true);
  // A completed character must not seed a later character's trait choices.
  // Cancelled or failed generation keeps its editable in-progress draft.
  document.addEventListener('hmk-generator-created',()=>{
    try{sessionStorage.removeItem(GENERATOR_KEY)}catch{}
  });
  // A changed value is never a save action. Until the step's submit button
  // confirms it, creation and generator edits live in DOM only.
  document.addEventListener('change',event=>{
    if(event.target?.closest?.('#hmk-generator-config,#creation-step-form'))return;
    enhance();
  },true);
  document.addEventListener('submit',event=>{
    const generatorForm=event.target?.closest?.('#hmk-generator-config');
    if(generatorForm) persistGeneratorDraft(generatorForm);
    const creationForm=event.target?.closest?.('#creation-step-form');
    if(creationForm) persistCreationDraft(creationForm);
  },true);
  document.addEventListener('click',()=>{ setTimeout(enhance,0); },true);
  window.addEventListener('load',enhance);
  new MutationObserver(()=>enhance()).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>
<script>
/* A private campaign snapshot is NOT a software release. A long-running tab checks
 * the deployed GitHub Pages index and refuses to keep writing from outdated code.
 * This never accesses GitHub credentials and never modifies campaign data.
 */
(function(){
 // Read the version from the very page that launched this tab, instead of
 // duplicating a hard-coded number that can go stale during a release.
 const runningVersion=(document.title.match(/\bv(\d+\.\d+)\b/)||[])[1]||null;
 let checkInFlight=false;
 function isNewer(a,b){const x=a.split('.').map(Number),y=b.split('.').map(Number);return x[0]>y[0]||(x[0]===y[0]&&x[1]>y[1]);}
 async function checkRelease(){
  if(!runningVersion||checkInFlight||document.visibilityState==='hidden'||window.__hmkOutdatedBuild)return;
  checkInFlight=true;
  try{
   const r=await fetch('./index.html?hmk_release_check='+Date.now(),{cache:'no-store'});
   if(!r.ok)return;
   const match=(await r.text()).match(/<title>[^<]*?v(\d+\.\d+)<\/title>/);
   if(!match||!isNewer(match[1],runningVersion))return;
   window.__hmkOutdatedBuild=true;
   if(document.querySelector('#hmk-release-notice'))return;
   const bar=document.createElement('aside');bar.id='hmk-release-notice';bar.setAttribute('role','alert');
   bar.style.cssText='position:fixed;z-index:2147483600;bottom:12px;left:12px;right:12px;padding:14px;background:#f7e6c9;border:2px solid #784025;color:#342010;box-shadow:0 4px 18px #0005;font:600 15px/1.5 system-ui,sans-serif';
   const message=document.createElement('span');message.textContent='Je dostupná novější verze HMK v'+match[1]+'. Starší otevřená aplikace nesmí zapisovat další akce. ';
   const button=document.createElement('button');button.type='button';button.textContent='Obnovit novou verzi';button.style.cssText='margin-left:12px;padding:6px 12px;font:inherit;cursor:pointer';
   button.onclick=()=>window.location.reload();bar.append(message,button);document.body.appendChild(bar);
  }catch{/* offline or blocked status check: do not infer that a newer release exists */}
  finally{checkInFlight=false;}
 }
 window.addEventListener('focus',checkRelease);
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')void checkRelease()});
 setInterval(checkRelease,60000);
})();
</script>
